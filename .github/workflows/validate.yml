name: Validate workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript files
        run: |
          for file in app.js world.js model-tools.js zip-utils.js render.js video-import.js shot-analysis.js chapter-analysis.js draft-world.js primitive-schema.js primitive-world.js primitive-editor.js ai-scene-editor.js primitive-preview.js environment-generation.js; do node --check --input-type=module < "$file"; done
      - name: Test video cut analysis and draft timeline
        run: node --test tests/test_video_analysis.mjs tests/test_chapter_analysis.mjs tests/test_primitives.mjs tests/test_primitive_editor_dom.mjs tests/test_scene_worker.mjs tests/test_primitive_preview.mjs tests/test_ai_scene_editor_dom.mjs tests/test_environment_generation.mjs
      - name: Check and test After Effects project builder (ExtendScript syntax)
        run: |
          node --check --input-type=commonjs < AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          node --test tests/test_aftereffects_builder.mjs
      - name: Lint PHP proxy and Worker script
        run: |
          php -l scene-proxy.php
          node --check worker/scene-worker.mjs
      - name: Validate timeline and model assets
        run: |
          python tests/test_workspace.py
          python tests/test_gateway_probe.py
          python -m unittest discover -s tests -p 'test_zen*.py' -v
      - name: Validate reproducible export bundle
        run: python scripts/build_workspace.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-validation-${{ github.sha }}
          path: dist/downloads/paige-video-render-workspace.zip
          retention-days: 14
