name: Validate workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript files
        run: |
          for file in app.js world.js model-tools.js ae-package-export.js ae-package-plan.js zip-utils.js render.js video-import.js shot-analysis.js chapter-analysis.js draft-world.js primitive-schema.js primitive-cleanup.js primitive-world.js primitive-editor.js ai-scene-editor.js primitive-preview.js environment-generation.js help-toggles.js scene-object-edit.js scene-object-operations.js timeline-operations.js timeline-tools.js animation-curves.js animation-graph.js camera-motion-sync.js accepted-camera-sync.js scene-asset-catalog.js radial-create.js spotlight-controls.js scene-effects.js scene-effects-panel.js portable-reference.js generation-sounds.js ai-generation-overlay.js; do node --check --input-type=module < "$file"; done
      - name: Test video cut analysis and draft timeline
        run: node --test tests/test_video_analysis.mjs tests/test_chapter_analysis.mjs tests/test_primitives.mjs tests/test_primitive_cleanup.mjs tests/test_primitive_editor_dom.mjs tests/test_scene_worker.mjs tests/test_ae_package_export.mjs tests/test_ae_native_scene.mjs tests/test_primitive_dom_contract.mjs tests/test_still_and_light_exports.mjs tests/test_aftereffects_builder.mjs tests/test_primitive_preview.mjs tests/test_ai_scene_editor_dom.mjs tests/test_environment_generation.mjs tests/test_help_toggles.mjs tests/test_scene_object_edit.mjs tests/test_generation_sounds.mjs tests/test_workspace_controls.mjs tests/test_reference_sequence.mjs tests/test_reference_frames.mjs tests/test_timeline_operations.mjs tests/test_animation_curves.mjs tests/test_portable_reference.mjs tests/test_camera_motion_sync.mjs tests/test_accepted_camera_sync.mjs tests/test_scene_creation_effects.mjs
      - name: Check and test After Effects project builder (ExtendScript syntax)
        run: |
          node --check --input-type=commonjs < AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          node --test tests/test_aftereffects_builder.mjs
      - name: Lint PHP proxy and Worker script
        run: |
          php -l scene-proxy.php
          node --check worker/scene-worker.mjs
          node --check scripts/inspect_argon_prompts.mjs
      # The 50webs host reports X-Powered-By: PHP/7.0.33. The runner's newer
      # PHP accepts 7.1+ syntax that is a fatal parse error in production.
      - name: Lint PHP proxy with the production PHP version (7.0)
        run: docker run --rm -v "$PWD":/app -w /app php:7.0-cli php -l scene-proxy.php
      # Durable Objects and alarms only exist in workerd; Node mocks cannot
      # prove them. Google is mocked inside the test, so nothing is billed.
      - name: Run the direct-image Durable Object in workerd (Miniflare)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/mf" miniflare@4.20260730.0
          MINIFLARE_MODULE="$RUNNER_TEMP/mf/node_modules/miniflare/dist/src/index.js" node tests/workerd_argon_jobs.mjs
      # Same Three.js release as the index.html import map.
      - name: Build and export every primitive with real Three.js
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/three" three@0.166.1
          THREE_NODE_MODULES="$RUNNER_TEMP/three/node_modules" node --test tests/three_primitive_world.mjs tests/test_array_prototype.mjs
      - name: Render fake spotlight depth regression in WebGL
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          THREE_NODE_MODULES="$RUNNER_TEMP/three/node_modules" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" node tests/browser/light-pool-depth.mjs
      - name: Validate timeline and model assets
        run: |
          python tests/test_workspace.py
          python tests/test_live_ae_builder.py
          python tests/test_gateway_probe.py
          python -m unittest discover -s tests -p 'test_zen*.py' -v
      - name: Validate reproducible export bundle
        run: python scripts/build_workspace.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-validation-${{ github.sha }}
          path: dist/downloads/paige-video-render-workspace.zip
          retention-days: 14
