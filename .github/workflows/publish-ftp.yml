name: Publish workspace via FTP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ftp-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Match the website FTP host in FileZilla (unencrypted port 21).
      FTP_HOST: paige-lighthouse.50webs.org
      # Exact user from the supplied FileZilla export.
      FTP_USER: paiver_paige-lighthouse.50webs.org
      FTP_PASSWORD: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workspace
        run: |
          python tests/test_workspace.py
          python tests/test_live_ae_builder.py
          python tests/test_gateway_probe.py
          python -m unittest discover -s tests -p 'test_zen*.py' -v
      - name: Check and test video importer
        run: |
          for file in app.js render.js shot-analysis.js chapter-analysis.js video-import.js draft-world.js primitive-schema.js primitive-cleanup.js primitive-world.js primitive-editor.js workspace-controls.js reference-sequence.js timeline-operations.js timeline-tools.js animation-curves.js animation-graph.js camera-motion-sync.js reference-builder.js reference-builder-ui.js reference-frames.js portable-reference.js scene-object-edit.js scene-object-operations.js ai-scene-editor.js primitive-preview.js environment-generation.js argon-detail.js ai-generation-overlay.js generation-sounds.js help-toggles.js; do node --check --input-type=module < "$file"; done
          node --test tests/test_video_analysis.mjs tests/test_chapter_analysis.mjs tests/test_primitives.mjs tests/test_primitive_cleanup.mjs tests/test_primitive_editor_dom.mjs tests/test_scene_worker.mjs tests/test_aftereffects_builder.mjs tests/test_ai_scene_editor_dom.mjs tests/test_primitive_preview.mjs tests/test_environment_generation.mjs tests/test_generation_sounds.mjs tests/test_workspace_controls.mjs tests/test_reference_sequence.mjs tests/test_reference_frames.mjs tests/test_timeline_operations.mjs tests/test_animation_curves.mjs tests/test_portable_reference.mjs tests/test_camera_motion_sync.mjs
      - name: Check and test After Effects project builder (ExtendScript syntax)
        run: |
          node --check --input-type=commonjs < AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          node --test tests/test_aftereffects_builder.mjs
      - name: Lint public PHP proxy
        run: |
          php -l scene-proxy.php
          # Never publish a proxy the production host (PHP/7.0.33) cannot parse.
          docker run --rm -v "$PWD":/app -w /app php:7.0-cli php -l scene-proxy.php
      - name: Build versioned workspace export
        run: python scripts/build_workspace.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ftp-workspace-${{ github.sha }}
          path: dist/downloads/paige-video-render-workspace.zip
          retention-days: 14
      - name: Determine whether FTP is configured
        id: config
        shell: bash
        run: |
          if [[ -n "$FTP_HOST" && -n "$FTP_USER" && -n "$FTP_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::FTP deployment not configured. Set FTP_PASS (or FTP_PASSWORD) secret to activate publishing.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage browser files and complete project ZIP
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ftp-public/downloads
          # Copy all root JS modules: app.js imports the video-intake and draft-world modules.
          # Wildcard staging avoids dropping newly added browser modules on future changes.
          cp dist/*.html dist/*.css dist/*.js dist/*.php dist/timeline.json ftp-public/
          for file in video-import.js shot-analysis.js draft-world.js primitive-schema.js primitive-cleanup.js primitive-world.js primitive-editor.js workspace-controls.js reference-sequence.js timeline-operations.js timeline-tools.js animation-curves.js animation-graph.js camera-motion-sync.js reference-builder.js reference-builder-ui.js reference-frames.js portable-reference.js scene-object-edit.js scene-object-operations.js ai-scene-editor.js primitive-preview.js environment-generation.js argon-detail.js ai-generation-overlay.js generation-sounds.js help-toggles.js scene-proxy.php; do
            test -s "ftp-public/$file" || { echo "Missing browser module: $file"; exit 1; }
          done
          # The only contents shipped into .private/ are a web access-deny
          # rule and a harmless probe. NEVER stage paiver.php or other secrets.
          # Fail the publish if either the access-deny rule or quiet 403 error page is missing.
          grep -Fxq 'Require all denied' public-private-guard/.htaccess
          grep -Fxq 'ErrorDocument 403 https://paige-lighthouse.50webs.org/Indium/paiver/' public-private-guard/.htaccess
          test -s 403.html
          grep -Fxq 'ErrorDocument 403 /Indium/paiver/403.html' .htaccess
          grep -Fxq 'RedirectMatch 302 ^/Indium/paiver/[.]private(/|$) /Indium/paiver/' .htaccess
          grep -Fxq 'RewriteEngine On' .htaccess
          grep -Fxq 'RewriteRule ^[.]private(/|$) /Indium/paiver/ [R=302,L,NC]' .htaccess
          # FTP account is rooted at /Indium/paiver; ship an editor-root
          # ErrorDocument override, not any protected file.
          cp .htaccess ftp-public/.htaccess
          mkdir -p ftp-public/.private
          cp public-private-guard/.htaccess public-private-guard/deny-check.txt ftp-public/.private/
          for sound in failed.mp3 success.mp3; do
            test -s "dist/assets/sounds/$sound" || { echo "Missing completion sound $sound"; exit 1; }
          done
          cp -a dist/assets ftp-public/assets
          # AE export downloads its ExtendScript builder from this exact live URL:
          # /Indium/paiver/AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          # It already exists in the workspace ZIP, but must also ship as a public
          # asset so the browser can fetch it before building the export ZIP.
          test -s dist/AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          cp -a dist/AfterEffects ftp-public/AfterEffects
          test -s ftp-public/AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          cmp dist/AfterEffects/BUILD_EDITABLE_PROJECT.jsx ftp-public/AfterEffects/BUILD_EDITABLE_PROJECT.jsx
          cp dist/downloads/paige-video-render-workspace.zip ftp-public/downloads/
      - name: Install lftp
        if: steps.config.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish to FTP login directory
        if: steps.config.outputs.configured == 'true'
        run: bash scripts/deploy_ftp.sh
      - name: Verify deployed After Effects JSX builder
        if: steps.config.outputs.configured == 'true'
        run: python scripts/check_live_ae_builder.py
      - name: Verify live PHP proxy and private-folder HTTP denial
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          # Check only public status and sanitized booleans; never log config,
          # PHP session values, CSRF tokens or any secret-bearing response body.
          python scripts/check_live_gateway.py
