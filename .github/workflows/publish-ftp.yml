name: Publish workspace via FTP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ftp-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Match the website FTP host in FileZilla (unencrypted port 21).
      FTP_HOST: paige-lighthouse.50webs.org
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workspace
        run: python tests/test_workspace.py
      - name: Build versioned workspace export
        run: python scripts/build_workspace.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ftp-workspace-${{ github.sha }}
          path: dist/downloads/paige-video-render-workspace.zip
          retention-days: 14
      - name: Determine whether FTP is configured
        id: config
        shell: bash
        run: |
          if [[ -n "$FTP_HOST" && -n "$FTP_USER" && -n "$FTP_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::FTP deployment not configured. Set FTP_USER and FTP_PASSWORD secrets to activate publishing.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage browser files and complete project ZIP
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ftp-public/downloads
          for file in index.html render.html styles.css app.js world.js render.js model-tools.js zip-utils.js timeline.json; do
            cp "dist/$file" ftp-public/
          done
          cp -a dist/assets ftp-public/assets
          cp dist/downloads/paige-video-render-workspace.zip ftp-public/downloads/
      - name: Install lftp
        if: steps.config.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish to FTP login directory
        if: steps.config.outputs.configured == 'true'
        run: bash scripts/deploy_ftp.sh
