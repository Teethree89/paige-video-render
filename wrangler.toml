name = "paige-video-render"
main = "worker/scene-worker.mjs"
compatibility_date = "2026-10-14"
workers_dev = true

# Keep non-secret dashboard variables if any are added later.
# Cloudflare retains encrypted Worker secrets across deploys by default.
# Do NOT declare [secrets].required here: production Workers Builds reported
# the bindings as absent and refused to deploy. The Worker instead verifies
# both runtime bindings and fails closed (HTTP 503) until they are set.
keep_vars = true

# Cloudflare's connected GitHub preview builds run `npx wrangler preview`.
# Bindings are not inherited from production. Cloudflare gives each Preview
# its own Durable Object namespace; do not set script_name to production.
[[previews.durable_objects.bindings]]
name = "ARGON_JOBS"
class_name = "ArgonJob"

[previews.version_metadata]
binding = "CF_VERSION_METADATA"

# Keep production logging configuration in Git so dashboard changes survive redeploys.
# Collect invocation and existing sanitized console diagnostics; do not log secrets.
[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Direct-image Argon jobs: a Durable Object holds the long synchronous Gemini
# call that PHP and a normal Worker request cannot wait for. The Workers Free
# plan only offers SQLite-backed Durable Objects, hence new_sqlite_classes.
[[durable_objects.bindings]]
name = "ARGON_JOBS"
class_name = "ArgonJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArgonJob"]

# The deployed version's id. A deploy restarts Durable Objects and cuts off a
# direct-image call in flight; the job compares versions to report that as
# job_interrupted_deploy rather than a generic interruption.
[version_metadata]
binding = "CF_VERSION_METADATA"

